<style>

<script>
        // Micro-interaction: Confetti generation
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#a43d02', '#386545', '#D9642C', '#a1d2aa'];
            
            for (let i = 0; i < 40; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                // Random drift animation
                const duration = 2 + Math.random() * 3;
                confetti.animate([
                    { transform: `translate(0, 0) rotate(0deg)`, opacity: 0 },
                    { transform: `translate(${Math.random() * 40 - 20}px, ${Math.random() * 40 - 20}px) rotate(${Math.random() * 180}deg)`, opacity: 0.6 },
                    { transform: `translate(${Math.random() * 60 - 30}px, ${Math.random() * 60 - 30}px) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    iterations: Infinity,
                    direction: 'alternate',
                    easing: 'ease-in-out'
                });

                container.appendChild(confetti);
            }
        }

        document.addEventListener('DOMContentLoaded', createConfetti);
    </script>
