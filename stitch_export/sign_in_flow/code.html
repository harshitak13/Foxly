<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .fox-paw-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
        }

        .fox-paw-pad {
            width: 12px;
            height: 12px;
            background-color: #D9642C;
            border-radius: 4px;
            opacity: 0.2;
            animation: fox-step 1.2s infinite ease-in-out;
        }

        @keyframes fox-step {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .fox-paw-pad:nth-child(2) { animation-delay: 0.2s; }
        .fox-paw-pad:nth-child(3) { animation-delay: 0.4s; }
        .fox-paw-pad:nth-child(4) { animation-delay: 0.6s; }

        .auth-card-shadow {
            box-shadow: 0 20px 40px -10px rgba(28, 28, 25, 0.15);
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#FAF6F1] min-h-screen flex items-center justify-center p-4 selection:bg-primary selection:text-white">
<!-- Main Navigation Suppression: This is a Transactional/Auth page, so we hide global nav -->
<main class="w-full max-w-[440px] flex flex-col items-center">
<!-- Logo Section -->
<header class="mb-stack-gap-lg flex flex-col items-center gap-2">
<div class="w-16 h-16 rounded-xl overflow-hidden flex items-center justify-center">
  <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDrgvqywsUUkwp5vWRjAInP2H19LvFuWXRFu6oy-7BtCfBqJ4jzNq3L9aTXx2mcwcE3LxOj-BcdS_sVz-aP6RcXHHIYCrkHN7i1mBkxUy8op_Njboub2WWgxHQD7MLJTRtqImKVKednwAbCO4pf1XQLH2-ETHqpc5miAncDvuil2XJ_TPKfh307jSJ1ZB1DuCIxc0_3I0sD9IA7ytRm4ggHkDu4oK43lOweCbtRv2Wi4dJv83oLeyB2DT9_rdp2OZn2JFJzgLqY0bHd" alt="Foxly Logo" class="w-full h-full object-cover">
</div>
<h1 class="font-display text-headline-md text-primary font-bold tracking-tight">Foxly</h1>
</header>
<!-- Auth Card Container -->
<div class="w-full bg-white rounded-[16px] p-8 auth-card-shadow border border-outline-variant/30">
<!-- Section 1: Email Sign-in (Initially Visible) -->
<section class="fade-in space-y-stack-gap-md" id="step-email">
<div class="text-center">
<h2 class="font-display text-headline-md text-on-background mb-2">Welcome Back</h2>
<p class="font-body-md text-on-surface-variant">Sign in to your secure guardian view</p>
</div>
<form class="space-y-stack-gap-md" onsubmit="event.preventDefault(); goToPasskey();">
<div class="space-y-stack-gap-sm">
<label class="font-label-md text-on-surface-variant block" for="email">Email Address</label>
<input class="w-full h-[48px] px-4 rounded-lg border border-outline-variant focus:border-primary focus:ring-0 transition-all font-body-md text-on-background placeholder:text-outline/50" id="email" placeholder="name@company.com" required="" type="email">
</div>
<button class="w-full h-[48px] bg-[#D9642C] hover:bg-primary-container text-white font-bold rounded-lg transition-all active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
<span class="">Next</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="pt-4 flex flex-col gap-4 text-center">
<div class="flex items-center gap-4">
<div class="flex-1 h-px bg-outline-variant"></div>
<span class="font-label-md text-outline">or</span>
<div class="flex-1 h-px bg-outline-variant"></div>
</div>
<button class="w-full h-[48px] border border-outline text-on-surface font-semibold rounded-lg hover:bg-surface-container transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">fingerprint</span>
<span class="">Sign in with SSO</span>
</button>
</div>
</section>
<!-- Section 2: Passkey Prompt (Initially Hidden) -->
<section class="hidden space-y-stack-gap-md text-center" id="step-passkey">
<div class="space-y-stack-gap-sm">
<div class="mx-auto w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center text-primary mb-2">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 1;">passkey</span>
</div>
<h2 class="font-display text-headline-md text-on-background">Use your passkey to sign in</h2>
<p class="font-body-md text-on-surface-variant">Confirm your identity using your device biometric or security key.</p>
</div>
<div class="py-8 space-y-stack-gap-md">
<!-- Fox-paw loading state -->
<div class="fox-paw-container">
<div class="fox-paw-pad"></div>
<div class="fox-paw-pad"></div>
<div class="fox-paw-pad"></div>
<div class="fox-paw-pad"></div>
</div>
<p class="font-label-md text-primary animate-pulse">Waiting for device...</p>
</div>
<div class="space-y-4">
<button class="w-full h-[48px] bg-[#D9642C] text-white font-bold rounded-lg opacity-50 cursor-not-allowed">
                        Confirming...
                    </button>
<button class="text-on-surface-variant font-label-md hover:text-primary transition-colors flex items-center justify-center mx-auto gap-1" onclick="goBack()">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
<span class="">Use a different method</span>
</button>
</div>
</section>
</div>
<!-- Footer Links (Subtle and minimal for auth flow) -->
<footer class="mt-stack-gap-lg flex gap-6">
<a class="font-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="font-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Support</a>
</footer>
</main>
<script>
        function goToPasskey() {
            const stepEmail = document.getElementById('step-email');
            const stepPasskey = document.getElementById('step-passkey');
            
            stepEmail.classList.add('hidden');
            stepPasskey.classList.remove('hidden');
            stepPasskey.classList.add('fade-in');

            // Simulate successful biometric check after 3 seconds for demonstration
            setTimeout(() => {
                const pawPads = document.querySelectorAll('.fox-paw-pad');
                pawPads.forEach(pad => {
                    pad.style.animation = 'none';
                    pad.style.opacity = '1';
                    pad.style.backgroundColor = '#386545'; // Success Mossy-Green
                });
                const statusText = document.querySelector('.animate-pulse');
                statusText.innerText = 'Identity Verified';
                statusText.classList.remove('text-primary');
                statusText.classList.add('text-tertiary');
            }, 3000);
        }

        function goBack() {
            const stepEmail = document.getElementById('step-email');
            const stepPasskey = document.getElementById('step-passkey');
            
            stepPasskey.classList.add('hidden');
            stepEmail.classList.remove('hidden');
            stepEmail.classList.add('fade-in');
        }
    </script>


</body></html>
