<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #FAF6F1; /* Warm off-white from design guidance */
        }
        .auth-card {
            box-shadow: 0 10px 40px -10px rgba(99, 93, 89, 0.15); /* 15% opacity of Charcoal color per guidance */
        }
        .fox-paw-loader {
            display: flex;
            gap: 4px;
        }
        .paw-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #a03b00;
            opacity: 0.4;
        }
        .paw-dot.active {
            opacity: 1;
            transform: translateY(-2px);
        }
    </style>

<body class="flex flex-col min-h-screen">
<!-- Top Navigation Header (Suppressed as per "Linear/Transactional" rule, but logo inclusion is part of the card flow) -->
<main class="flex-grow flex items-center justify-center p-container-padding">
<!-- Auth Card -->
<div class="w-full max-w-auth-card-max bg-white rounded-xl auth-card p-stack-gap-lg flex flex-col items-center">
<!-- Brand Anchor - Logo -->
<div class="mb-stack-gap-lg">
<img alt="Foxly Logo" class="w-16 h-16 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLu_KxwpRBUKCgwhtAD4lyvX_0pOgPboS6TjyoMKAWg8OZOH_hYL0XMB3oZIB7BOKr7C9grXgLPVJn4-PTUfX1cbXkKFUGoD5VPCBD9J7onbezVs7OZdLCs4I0F4xnozVoANmjaSbTOZAFowkAiiMtApcCIYmZEDNKx_JqU_zq01_XHofjUs0p7s1TVSV6VKeZlql1kBVBubtQxyidhnnvBgFck4muQAiEFB11VEzf1W6tNfVuWsUoiNJOfu"/>
</div>
<!-- Header -->
<div class="text-center mb-stack-gap-lg">
<h1 class="font-headline-md text-headline-md text-on-background mb-2">Create your account</h1>
<p class="font-body-md text-body-md text-secondary">Step 1: Basic Details</p>
</div>
<!-- Sign Up Form -->
<form action="#" class="w-full space-y-stack-gap-md" id="signupForm" method="POST">
<!-- Full Name Field -->
<div class="flex flex-col gap-stack-gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="full_name">Full name</label>
<input class="w-full h-[48px] px-4 rounded-lg border border-outline-variant bg-surface focus:ring-0 focus:border-primary-container transition-all outline-none font-body-md text-on-surface" id="full_name" name="full_name" placeholder="Enter your full name" required="" type="text"/>
</div>
<!-- Email Address Field -->
<div class="flex flex-col gap-stack-gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email address</label>
<input class="w-full h-[48px] px-4 rounded-lg border border-outline-variant bg-surface focus:ring-0 focus:border-primary-container transition-all outline-none font-body-md text-on-surface" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<!-- Action Button -->
<button class="w-full h-[48px] bg-primary text-on-primary font-bold rounded-lg hover:opacity-90 active:scale-95 transition-all flex items-center justify-center mt-stack-gap-lg" id="submitBtn" type="submit">
<span>Continue</span>
</button>
<!-- Loading State (Initially Hidden) -->
<div class="hidden flex flex-col items-center justify-center gap-2 mt-stack-gap-lg h-[48px]" id="loader">
<div class="fox-paw-loader">
<div class="paw-dot"></div>
<div class="paw-dot"></div>
<div class="paw-dot"></div>
<div class="paw-dot"></div>
</div>
</div>
</form>
<!-- Secondary Action -->
<div class="mt-stack-gap-lg text-center">
<p class="font-body-md text-body-md text-secondary">
                    Already have an account? 
                    <a class="text-primary font-bold hover:underline transition-all" href="#">Sign in</a>
</p>
</div>
</div>
</main>
<!-- Footer from Shared Components JSON -->
<footer class="w-full bottom-0 left-0 bg-transparent flex flex-col md:flex-row justify-center items-center gap-stack-gap-md py-stack-gap-lg font-label-md text-label-md text-secondary">
<div class="font-display text-headline-md text-primary mr-4">Foxly</div>
<div class="flex gap-4">
<a class="text-secondary hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="text-secondary hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="text-secondary hover:text-primary transition-colors" href="#">Help Center</a>
</div>
<div class="mt-2 md:mt-0 text-on-secondary-fixed-variant">© 2024 Foxly Security. All rights reserved.</div>
</footer>
<script>
        // Micro-interaction for Fox-paw loader
        const form = document.getElementById('signupForm');
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const pawDots = document.querySelectorAll('.paw-dot');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Toggle UI states
            submitBtn.classList.add('hidden');
            loader.classList.remove('hidden');

            // Animation sequence for paws
            let currentStep = 0;
            const animatePaws = () => {
                pawDots.forEach((dot, index) => {
                    if (index === currentStep) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                });
                currentStep = (currentStep + 1) % pawDots.length;
            };

            const animationInterval = setInterval(animatePaws, 300);

            // Simulate navigation/processing
            setTimeout(() => {
                clearInterval(animationInterval);
                console.log("Form data submitted. Moving to Page 2...");
                // In a real app: window.location.href = '/signup/page2';
            }, 3000);
        });

        // Basic input focus styling beyond CSS
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').classList.remove('text-primary');
            });
        });
    </script>
